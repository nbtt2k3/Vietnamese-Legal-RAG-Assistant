name: Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend and RAG Regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      CROSS_ENCODER_RERANKING_ENABLED: "false"
      LLM_JUDGE_ENABLED: "false"
      SECRET_KEY: ci_secret_key_with_at_least_32_chars
      API_KEY: ci_api_key_with_at_least_16_chars
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend and RAG tests
        run: python -m pytest -q

      - name: Validate UTF-8 source files
        run: python scripts/validate_encoding.py . ../frontend

      - name: Validate source registry governance
        run: python scripts/validate_source_registry.py --path data/source_registry.json

  frontend:
    name: Frontend Regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
