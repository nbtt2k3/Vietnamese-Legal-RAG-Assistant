  - "là gì"
  - "như thế nào"
  - "có được"
  - "không"
  - "tại"
  - "quy định"
  - "nào"

domain_config:
  source_authority_order:
    - "bo_luat"
    - "nghi_quyet"
    - "nghi_dinh"
    - "an_le"
  meta_bonus_weights:
    "bo_luat": 0.8
    "luat": 0.6
    "nghi_dinh": 0.4
    "thong_tu": 0.2
  validity_keywords:
    - "hiệu lực"
    - "thời điểm"
    - "có hiệu lực từ"
    - "công chứng"
    - "chứng thực"
    - "thỏa thuận"
    - "đối kháng"
